<script>
document.addEventListener('DOMContentLoaded', function(){
  const API_BASE = window.location.origin;

  // Ищем токен. Добавлена защита от кривых сохранений (null/undefined)
  const getToken = () => {
    const t = localStorage.getItem('token') || localStorage.getItem('gec_token') || localStorage.getItem('admin_token') || '';
    if (t === 'null' || t === 'undefined') return '';
    return t;
  };
  
  const setToken = (token) => { 
    localStorage.setItem('token', token); 
    localStorage.setItem('admin_token', token); 
    localStorage.setItem('gec_token', token); 
  };
  
  const getAuthHeaders = () => {
    const t = getToken();
    return t ? { Authorization: 'Bearer ' + t } : {};
  };

  async function apiCall(url, options = {}) {
    try {
      const res = await fetch(url, options);
      if (res.status === 401 || res.status === 403) {
        document.getElementById('loginModal').style.display = 'block';
        throw new Error('Unauthorized');
      }
      const data = await res.json();
      return data;
    } catch (e) { console.error(e); throw e; }
  }

  // UI логина
  const loginModal = document.getElementById('loginModal');
  const loginBtn = document.getElementById('loginBtn');
  
  // Кнопка закрытия логина
  document.getElementById('loginCloseBtn').onclick = () => loginModal.style.display = 'none';
  
  // Автоматическая проверка: если нет токена - показываем кнопку входа
  setInterval(() => {
    if (!getToken()) {
      if (loginBtn) loginBtn.style.display = 'block';
    } else {
      if (loginBtn) loginBtn.style.display = 'none';
    }
  }, 1000);

  if (loginBtn) {
    loginBtn.onclick = () => loginModal.style.display = 'block';
  }

  // Обработка формы входа
  document.getElementById('adminLoginForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok && data.token) {
        setToken(data.token);
        loginModal.style.display = 'none';
        alert('Успешный вход! Теперь все кнопки работают.');
      } else { alert(data.message || 'Ошибка входа'); }
    } catch (err) { alert('Ошибка сети при входе'); }
  };

  // --- ПОЛЬЗОВАТЕЛИ ---
  const usersModal = document.getElementById('usersModal');
  document.getElementById('usersLaunchBtn').onclick = () => { 
    if(getToken()){ usersModal.style.display='block'; loadUsers(); } 
    else { loginModal.style.display='block'; } // Открываем логин, если нет токена
  };
  document.getElementById('usersClose').onclick = () => usersModal.style.display='none';
  document.getElementById('usersReload').onclick = loadUsers;

  async function loadUsers() {
    const data = await apiCall(API_BASE + '/api/admin/users', { headers: getAuthHeaders() });
    if(!data) return;
    const tbody = document.getElementById('usersTbody'); tbody.innerHTML = '';
    (data.users || []).forEach(u => {
      tbody.innerHTML += `<tr><td>${u.email}</td><td>${u.firstName||''} ${u.lastName||''}</td><td><b>${u.role}</b></td>
        <td><button class="btn danger" onclick="deleteUser('${u._id}')">Del</button></td></tr>`;
    });
  }
  window.deleteUser = async (id) => { if(confirm('Удалить?')) { await apiCall(`${API_BASE}/api/admin/users/${id}`, { method: 'DELETE', headers: getAuthHeaders() }); loadUsers(); } };

  // --- СЛОТЫ ---
  const slotsModal = document.getElementById('slotsModal');
  const slotEditor = document.getElementById('slotEditor');
  let editingId = null;
  document.getElementById('slotsLaunchBtn').onclick = () => { 
    if(getToken()){ slotsModal.style.display='block'; listSlots(); } 
    else { loginModal.style.display='block'; }
  };
  document.getElementById('slotsClose').onclick = () => slotsModal.style.display='none';
  document.getElementById('slotReload').onclick = listSlots;
  document.getElementById('slotAdd').onclick = () => { slotEditor.style.display='block'; editingId=null; };
  document.getElementById('f_cancelBtn').onclick = () => slotEditor.style.display='none';
  document.getElementById('f_kind').onchange = (e) => {
    const isRec = e.target.value === 'recurring';
    document.querySelectorAll('.grp-rec').forEach(el => el.style.display = isRec ? 'block' : 'none');
    document.querySelectorAll('.grp-one').forEach(el => el.style.display = isRec ? 'none' : 'block');
  };
  async function listSlots(){
    const data = await apiCall(API_BASE + '/api/admin/slots', { headers: getAuthHeaders() });
    if(!data) return;
    const tbody = document.getElementById('slotsTbody'); tbody.innerHTML = '';
    (data.items||[]).forEach(s => {
      const when = s.kind === 'recurring' ? `DOW ${s.dow} ${s.startTime}-${s.endTime}` : `${(s.startISO||'').replace('T',' ')}`;
      tbody.innerHTML += `<tr><td>${s.kind}</td><td>${when}</td><td>${s.teacherName}</td><td>${s.isActive}</td>
        <td><button class="btn" onclick='editSlot(${JSON.stringify(s)})'>Edit</button> <button class="btn danger" onclick="deleteSlot('${s._id}')">Del</button></td></tr>`;
    });
  }
  window.editSlot = (s) => { 
    slotEditor.style.display='block'; editingId=s._id;
    document.getElementById('f_kind').value = s.kind;
    document.getElementById('f_kind').dispatchEvent(new Event('change'));
    if(s.kind==='recurring'){ 
      document.getElementById('f_dow').value=s.dow; document.getElementById('f_startTime').value=s.startTime; document.getElementById('f_endTime').value=s.endTime; 
    } else { 
      document.getElementById('f_startISO').value=s.startISO ? s.startISO.slice(0,16) : ''; document.getElementById('f_endISO').value=s.endISO ? s.endISO.slice(0,16) : ''; 
    }
    document.getElementById('f_teacherName').value=s.teacherName; document.getElementById('f_teacherId').value=s.teacherId || ''; document.getElementById('f_isActive').value=s.isActive.toString();
  };
  document.getElementById('f_saveBtn').onclick = async () => { 
    const kind = document.getElementById('f_kind').value;
    const payload = { kind, teacherName: document.getElementById('f_teacherName').value, teacherId: document.getElementById('f_teacherId').value || undefined, isActive: document.getElementById('f_isActive').value==='true' };
    if(kind==='recurring'){ payload.dow=parseInt(document.getElementById('f_dow').value); payload.startTime=document.getElementById('f_startTime').value; payload.endTime=document.getElementById('f_endTime').value; } 
    else { payload.startISO=document.getElementById('f_startISO').value; payload.endISO=document.getElementById('f_endISO').value; }
    await apiCall(editingId ? `${API_BASE}/api/admin/slots/${editingId}` : `${API_BASE}/api/admin/slots`, { method: editingId ? 'PATCH' : 'POST', headers: {'Content-Type':'application/json',...getAuthHeaders()}, body:JSON.stringify(payload) });
    slotEditor.style.display='none'; listSlots();
  };
  window.deleteSlot = async(id) => { if(confirm('Удалить слот?')) { await apiCall(`${API_BASE}/api/admin/slots/${id}`,{method:'DELETE',headers:getAuthHeaders()}); listSlots(); } };

  // --- УРОКИ ---
  const lessonModal = document.getElementById('lessonModal');
  document.getElementById('lessonLaunchBtn').onclick = () => { 
    if(getToken()) lessonModal.style.display='block'; 
    else loginModal.style.display='block';
  };
  document.getElementById('lessonCloseBtn').onclick = () => lessonModal.style.display='none';
  document.getElementById('L_submit').onclick = async () => {
    const payload = { email: document.getElementById('L_email').value, childName: document.getElementById('L_child').value, parentName: document.getElementById('L_parent').value, level: document.getElementById('L_level').value, dateStr: document.getElementById('L_date').value, timeStr: document.getElementById('L_time').value, teacherName: document.getElementById('L_teacher').value };
    await apiCall(`${API_BASE}/api/admin/bookings/create`, {method:'POST',headers:{'Content-Type':'application/json',...getAuthHeaders()},body:JSON.stringify(payload)});
    alert('Создано'); lessonModal.style.display='none';
  };

  // --- ОТЗЫВЫ ---
  const reviewsModal = document.getElementById('reviewsModal');
  document.getElementById('reviewsLaunchBtn').onclick = () => { 
    if(getToken()){ reviewsModal.style.display='block'; loadAdminReviews(); } 
    else { loginModal.style.display='block'; }
  };
  document.getElementById('reviewsCloseBtn').onclick = () => reviewsModal.style.display='none';
  async function loadAdminReviews() {
    const data = await apiCall(`${API_BASE}/api/admin/reviews`, { headers: getAuthHeaders() });
    if(!data) return;
    const tbody = document.getElementById('reviewsTableBody'); tbody.innerHTML = '';
    (data.reviews || []).forEach(r => {
      tbody.innerHTML += `<tr><td>${new Date(r.createdAt).toLocaleDateString()}</td><td>${r.name}</td><td>${r.text}</td><td>${r.status}</td>
        <td>${r.status!=='Approved'?`<button class="btn primary" onclick="updRev('${r._id}','Approved')">Approve</button>`:''}<button class="btn danger" onclick="delRev('${r._id}')">Del</button></td></tr>`;
    });
  }
  window.updRev = async(id, s) => { await apiCall(`${API_BASE}/api/admin/reviews/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',...getAuthHeaders()},body:JSON.stringify({status:s})}); loadAdminReviews(); };
  window.delRev = async(id) => { if(confirm('Удалить?')) { await apiCall(`${API_BASE}/api/admin/reviews/${id}`,{method:'DELETE',headers:getAuthHeaders()}); loadAdminReviews(); } };

  // --- ОТЛОЖЕННЫЕ КРЕДИТЫ ---
  const deferredModal = document.getElementById('deferredModal');
  const deferredEditor = document.getElementById('deferredEditor');
  let editingDefId = null;
  document.getElementById('deferredLaunchBtn').onclick = () => { 
    if(getToken()){ deferredModal.style.display='block'; loadDeferred(); } 
    else { loginModal.style.display='block'; }
  };
  document.getElementById('deferredCloseBtn').onclick = () => deferredModal.style.display='none';
  document.getElementById('deferredAddBtn').onclick = () => { deferredEditor.style.display='block'; editingDefId = null; document.getElementById('def_email').value=''; };
  document.getElementById('def_cancelBtn').onclick = () => { deferredEditor.style.display='none'; };
  document.getElementById('deferredReloadBtn').onclick = loadDeferred;
  
  async function loadDeferred() {
    const data = await apiCall(`${API_BASE}/api/admin/deferred`, { headers: getAuthHeaders() });
    if(!data) return;
    const tbody = document.getElementById('deferredTbody'); tbody.innerHTML = '';
    (data.deferred || []).forEach(d => {
      tbody.innerHTML += `<tr><td>${d.student?.firstName||''}</td><td>${d.student?.email||''}</td><td>${d.month}</td><td>${d.count}</td>
        <td><button class="btn danger" onclick="deleteDeferred('${d._id}')">Del</button></td></tr>`;
    });
  }
  document.getElementById('def_saveBtn').onclick = async () => {
    const payload = { studentEmail: document.getElementById('def_email').value, month: document.getElementById('def_month').value, count: parseInt(document.getElementById('def_count').value, 10) };
    await apiCall(editingDefId ? `${API_BASE}/api/admin/deferred/${editingDefId}` : `${API_BASE}/api/admin/deferred`, { method: editingDefId ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, body: JSON.stringify(payload) });
    deferredEditor.style.display = 'none'; loadDeferred();
  };
  window.deleteDeferred = async (id) => { if (confirm('Удалить?')) { await apiCall(`${API_BASE}/api/admin/deferred/${id}`, { method: 'DELETE', headers: getAuthHeaders() }); loadDeferred(); } };
});
</script>
