<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand English Super Admin</title>
<style>
  body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; background: #f8fafc; }
  .iframe-wrapper { height: 100vh; width: 100%; border: 0; }
  
  #lessonLaunchBtn, #reviewsLaunchBtn, #slotsLaunchBtn, #usersLaunchBtn, #deferredLaunchBtn {
    position: fixed; right: 16px; z-index: 99999;
    color: #fff; border: none; border-radius: 12px;
    padding: 10px 14px; box-shadow: 0 10px 22px rgba(0,0,0,.18);
    cursor: pointer; font-weight: 800; font-family: inherit;
  }
  #slotsLaunchBtn   { bottom: 16px;  background: #111827; }
  #lessonLaunchBtn  { bottom: 66px;  background: #2563eb; }
  #reviewsLaunchBtn { bottom: 116px; background: #7C3AED; }
  #usersLaunchBtn   { bottom: 166px; background: #059669; }
  #deferredLaunchBtn{ bottom: 216px; background: #B45309; }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 99998; display: none;
    background: rgba(0,0,0,.45); backdrop-filter: saturate(120%) blur(1px); overflow-y: auto; padding: 20px;
  }
  .panel { max-width: 980px; margin: 5vh auto; background: #fff; border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,.22); overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; background: #fff; }
  .panel-body { padding: 12px 14px; overflow-y: auto; flex: 1; }
  .panel-title { font-weight: 900; font-size: 1.1em; }
  .controls { display: flex; gap: 8px; }
  .btn { padding: 8px 12px; border-radius: 10px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 13px; }
  .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .btn.danger { background: #ef4444; color: #fff; border-color: #ef4444; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; background: #f8fafc; position: sticky; top: 0; }
  td { padding: 8px; border-bottom: 1px solid #f1f5f9; }
  #slotEditor { display: none; margin: 10px 0; padding: 10px; background: #f8fafc; border-radius: 10px; border: 1px solid #e5e7eb; }
  .row-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; align-items: end; }
  .row-grid label { font-size: 11px; color: #6b7280; display: block; margin-bottom: 4px; }
  input, select { width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
</style>
</head>
<body>

<div class="iframe-wrapper">
  <iframe id="adminIframe" src="/admin-ui/admin.html" style="width:100%; height:100%; border:0;"></iframe>
</div>

<button id="lessonLaunchBtn">Create Lesson</button>
<button id="reviewsLaunchBtn">Manage Reviews</button>
<button id="usersLaunchBtn">Manage Users</button>
<button id="deferredLaunchBtn">Deferred Credits</button>
<button id="slotsLaunchBtn">Manage Slots</button>

<div id="usersModal" class="modal-overlay">
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">Manage Users</div>
      <div class="controls"><button class="btn" id="usersReload">Reload</button><button class="btn danger" id="usersClose">Close</button></div>
    </div>
    <div class="panel-body">
      <table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Actions</th></tr></thead><tbody id="usersTbody"></tbody></table>
    </div>
  </div>
</div>

<div id="slotsModal" class="modal-overlay">
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">Manage Slots</div>
      <div class="controls"><button class="btn" id="slotAdd">Add slot</button><button class="btn" id="slotReload">Reload</button><button class="btn danger" id="slotsClose">Close</button></div>
    </div>
    <div class="panel-body">
      <div id="slotEditor">
        <div class="row-grid">
          <div><label>Kind</label><select id="f_kind"><option value="recurring">Recurring</option><option value="oneoff">One-off</option></select></div>
          <div class="grp-rec"><label>DOW (0-6)</label><input id="f_dow" type="number" min="0" max="6"></div>
          <div class="grp-rec"><label>Start (HH:mm)</label><input id="f_startTime" type="time"></div>
          <div class="grp-rec"><label>End (HH:mm)</label><input id="f_endTime" type="time"></div>
          <div class="grp-one" style="display:none"><label>Start ISO</label><input id="f_startISO" type="datetime-local"></div>
          <div class="grp-one" style="display:none"><label>End ISO</label><input id="f_endISO" type="datetime-local"></div>
          <div><label>Teacher Name</label><input id="f_teacherName" type="text" value="Teacher"></div>
          <div><label>Teacher ID</label><input id="f_teacherId" type="text"></div>
          <div><label>Active</label><select id="f_isActive"><option value="true">true</option><option value="false">false</option></select></div>
          <div style="align-self:end"><button class="btn primary" id="f_saveBtn">Save</button> <button class="btn" id="f_cancelBtn">Cancel</button></div>
        </div>
      </div>
      <table><thead><tr><th>kind</th><th>when</th><th>teacher</th><th>active</th><th>actions</th></tr></thead><tbody id="slotsTbody"></tbody></table>
    </div>
  </div>
</div>

<div id="lessonModal" class="modal-overlay">
  <div class="panel" style="max-width:800px;">
    <div class="panel-head">
      <div class="panel-title">Create Lesson</div>
      <button class="btn danger" id="lessonCloseBtn">Close</button>
    </div>
    <div class="panel-body">
      <div class="row-grid" style="grid-template-columns: repeat(2, 1fr);">
        <div><label>Student Email</label><input id="L_email" type="email"></div>
        <div><label>Child Name</label><input id="L_child" type="text"></div>
        <div><label>Parent Name</label><input id="L_parent" type="text"></div>
        <div><label>Level</label><input id="L_level" type="text"></div>
        <div><label>Date</label><input id="L_date" type="date"></div>
        <div><label>Time</label><input id="L_time" type="time"></div>
        <div><label>Teacher Name</label><input id="L_teacher" type="text" value="Teacher"></div>
        <div><label>Teacher ID</label><input id="L_teacherId" type="text"></div>
      </div>
      <button class="btn primary" id="L_submit" style="margin-top:15px; width:100%">Create</button>
    </div>
  </div>
</div>

<div id="reviewsModal" class="modal-overlay">
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">Student Reviews</div>
      <button class="btn danger" id="reviewsCloseBtn">Close</button>
    </div>
    <div class="panel-body">
      <table><thead><tr><th>Date</th><th>Student</th><th>Review</th><th>Status</th><th>Action</th></tr></thead><tbody id="reviewsTableBody"></tbody></table>
    </div>
  </div>
</div>

<div id="deferredModal" class="modal-overlay">
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">Manage Deferred Credits</div>
      <div class="controls"><button class="btn" id="deferredAddBtn">Add Credit</button><button class="btn" id="deferredReloadBtn">Reload</button><button class="btn danger" id="deferredCloseBtn">Close</button></div>
    </div>
    <div class="panel-body">
      <div id="deferredEditor" style="display:none; background:#f8fafc; padding:10px; border-radius:8px; margin-bottom:12px;">
        <div class="row-grid" style="grid-template-columns: 1fr 1fr 80px auto;">
          <div><label>Student Email</label><input id="def_email" type="email"></div>
          <div><label>Month (YYYY-MM)</label><input id="def_month" type="month"></div>
          <div><label>Count</label><input id="def_count" type="number" min="0" max="2" value="1"></div>
          <div style="align-self:end"><button class="btn primary" id="def_saveBtn">Save</button> <button class="btn" id="def_cancelBtn">Cancel</button></div>
        </div>
      </div>
      <table><thead><tr><th>Student</th><th>Email</th><th>Month</th><th>Count</th><th>Actions</th></tr></thead><tbody id="deferredTbody"></tbody></table>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const API_BASE = window.location.origin;

  const getToken = () => localStorage.getItem('token') || localStorage.getItem('gec_token') || localStorage.getItem('admin_token') || '';

  const getAuthHeaders = () => {
    const t = getToken();
    return t ? { Authorization: 'Bearer ' + t } : {};
  };

  async function apiCall(url, options = {}) {
    try {
      const res = await fetch(url, options);
      if (res.status === 401 || res.status === 403) {
        alert('Доступ запрещен. Убедись, что ты вошел под почтой grand.english.courses@gmail.com!');
        throw new Error('Unauthorized');
      }
      const data = await res.json();
      return data;
    } catch (e) { console.error(e); throw e; }
  }

  // --- ПОЛЬЗОВАТЕЛИ ---
  const usersModal = document.getElementById('usersModal');
  document.getElementById('usersLaunchBtn').onclick = () => { if(getToken()){ usersModal.style.display='block'; loadUsers(); } else alert("Войдите в систему!"); };
  document.getElementById('usersClose').onclick = () => usersModal.style.display='none';
  document.getElementById('usersReload').onclick = loadUsers;

  async function loadUsers() {
    const data = await apiCall(API_BASE + '/api/admin/users', { headers: getAuthHeaders() });
    const tbody = document.getElementById('usersTbody');
    tbody.innerHTML = '';
    (data.users || []).forEach(u => {
      tbody.innerHTML += `<tr><td>${u.email}</td><td>${u.firstName||''} ${u.lastName||''}</td><td><b>${u.role}</b></td>
        <td><button class="btn danger" onclick="deleteUser('${u._id}')">Del</button></td></tr>`;
    });
  }
  window.deleteUser = async (id) => { if(confirm('Удалить?')) { await apiCall(`${API_BASE}/api/admin/users/${id}`, { method: 'DELETE', headers: getAuthHeaders() }); loadUsers(); } };

  // --- СЛОТЫ ---
  const slotsModal = document.getElementById('slotsModal');
  const slotEditor = document.getElementById('slotEditor');
  let editingId = null;
  document.getElementById('slotsLaunchBtn').onclick = () => { if(getToken()){ slotsModal.style.display='block'; listSlots(); } };
  document.getElementById('slotsClose').onclick = () => slotsModal.style.display='none';
  document.getElementById('slotReload').onclick = listSlots;
  document.getElementById('slotAdd').onclick = () => { slotEditor.style.display='block'; editingId=null; };
  document.getElementById('f_cancelBtn').onclick = () => slotEditor.style.display='none';
  document.getElementById('f_kind').onchange = (e) => {
    const isRec = e.target.value === 'recurring';
    document.querySelectorAll('.grp-rec').forEach(el => el.style.display = isRec ? 'block' : 'none');
    document.querySelectorAll('.grp-one').forEach(el => el.style.display = isRec ? 'none' : 'block');
  };
  async function listSlots(){
    const data = await apiCall(API_BASE + '/api/admin/slots', { headers: getAuthHeaders() });
    const tbody = document.getElementById('slotsTbody'); tbody.innerHTML = '';
    (data.items||[]).forEach(s => {
      const when = s.kind === 'recurring' ? `DOW ${s.dow} ${s.startTime}-${s.endTime}` : `${(s.startISO||'').replace('T',' ')}`;
      tbody.innerHTML += `<tr><td>${s.kind}</td><td>${when}</td><td>${s.teacherName}</td><td>${s.isActive}</td>
        <td><button class="btn" onclick='editSlot(${JSON.stringify(s)})'>Edit</button> <button class="btn danger" onclick="deleteSlot('${s._id}')">Del</button></td></tr>`;
    });
  }
  window.editSlot = (s) => { /* Логика редактирования скрыта для краткости */ };
  document.getElementById('f_saveBtn').onclick = async () => { /* Сохранение слота */ };
  window.deleteSlot = async(id) => { if(confirm('Удалить?')) { await apiCall(`${API_BASE}/api/admin/slots/${id}`,{method:'DELETE',headers:getAuthHeaders()}); listSlots(); } };

  // --- УРОКИ ---
  const lessonModal = document.getElementById('lessonModal');
  document.getElementById('lessonLaunchBtn').onclick = () => { if(getToken()) lessonModal.style.display='block'; };
  document.getElementById('lessonCloseBtn').onclick = () => lessonModal.style.display='none';
  document.getElementById('L_submit').onclick = async () => {
    const payload = { email: document.getElementById('L_email').value, childName: document.getElementById('L_child').value, parentName: document.getElementById('L_parent').value, level: document.getElementById('L_level').value, dateStr: document.getElementById('L_date').value, timeStr: document.getElementById('L_time').value, teacherName: document.getElementById('L_teacher').value };
    await apiCall(`${API_BASE}/api/admin/bookings/create`, {method:'POST',headers:{'Content-Type':'application/json',...getAuthHeaders()},body:JSON.stringify(payload)});
    alert('Создано'); lessonModal.style.display='none';
  };

  // --- ОТЗЫВЫ ---
  const reviewsModal = document.getElementById('reviewsModal');
  document.getElementById('reviewsLaunchBtn').onclick = () => { if(getToken()){ reviewsModal.style.display='block'; loadAdminReviews(); } };
  document.getElementById('reviewsCloseBtn').onclick = () => reviewsModal.style.display='none';
  async function loadAdminReviews() {
    const data = await apiCall(`${API_BASE}/api/admin/reviews`, { headers: getAuthHeaders() });
    const tbody = document.getElementById('reviewsTableBody'); tbody.innerHTML = '';
    (data.reviews || []).forEach(r => {
      tbody.innerHTML += `<tr><td>${new Date(r.createdAt).toLocaleDateString()}</td><td>${r.name}</td><td>${r.text}</td><td>${r.status}</td>
        <td>${r.status!=='Approved'?`<button class="btn primary" onclick="updRev('${r._id}','Approved')">Approve</button>`:''}<button class="btn danger" onclick="delRev('${r._id}')">Del</button></td></tr>`;
    });
  }
  window.updRev = async(id, s) => { await apiCall(`${API_BASE}/api/admin/reviews/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json',...getAuthHeaders()},body:JSON.stringify({status:s})}); loadAdminReviews(); };
  window.delRev = async(id) => { if(confirm('Удалить?')) { await apiCall(`${API_BASE}/api/admin/reviews/${id}`,{method:'DELETE',headers:getAuthHeaders()}); loadAdminReviews(); } };

  // --- ОТЛОЖЕННЫЕ КРЕДИТЫ ---
  const deferredModal = document.getElementById('deferredModal');
  const deferredEditor = document.getElementById('deferredEditor');
  let editingDefId = null;
  document.getElementById('deferredLaunchBtn').onclick = () => { if(getToken()){ deferredModal.style.display='block'; loadDeferred(); } };
  document.getElementById('deferredCloseBtn').onclick = () => deferredModal.style.display='none';
  document.getElementById('deferredAddBtn').onclick = () => { deferredEditor.style.display='block'; editingDefId = null; };
  document.getElementById('def_cancelBtn').onclick = () => { deferredEditor.style.display='none'; };
  document.getElementById('deferredReloadBtn').onclick = loadDeferred;
  
  async function loadDeferred() {
    const data = await apiCall(`${API_BASE}/api/admin/deferred`, { headers: getAuthHeaders() });
    const tbody = document.getElementById('deferredTbody'); tbody.innerHTML = '';
    (data.deferred || []).forEach(d => {
      tbody.innerHTML += `<tr><td>${d.student?.firstName||''}</td><td>${d.student?.email||''}</td><td>${d.month}</td><td>${d.count}</td>
        <td><button class="btn danger" onclick="deleteDeferred('${d._id}')">Del</button></td></tr>`;
    });
  }
  document.getElementById('def_saveBtn').onclick = async () => {
    const payload = { studentEmail: document.getElementById('def_email').value, month: document.getElementById('def_month').value, count: parseInt(document.getElementById('def_count').value, 10) };
    await apiCall(editingDefId ? `${API_BASE}/api/admin/deferred/${editingDefId}` : `${API_BASE}/api/admin/deferred`, { method: editingDefId ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json', ...getAuthHeaders() }, body: JSON.stringify(payload) });
    deferredEditor.style.display = 'none'; loadDeferred();
  };
  window.deleteDeferred = async (id) => { if (confirm('Удалить?')) { await apiCall(`${API_BASE}/api/admin/deferred/${id}`, { method: 'DELETE', headers: getAuthHeaders() }); loadDeferred(); } };
});
</script>
</body>
</html>
