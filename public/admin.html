<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GE — Admin Panel</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#0f172a;--muted:#6b7280;--primary:#3b82f6;--border:#e5e7eb}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,Segoe UI,Inter,Arial,sans-serif;color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.wrap{max-width:1200px;margin:16px auto;padding:0 16px;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,button{height:40px;border-radius:10px;border:1px solid var(--border);padding:0 12px;font:inherit}
button{background:var(--primary);color:#fff;border:none;cursor:pointer;transition: opacity 0.2s;}
button:disabled{opacity:0.6;cursor:not-allowed;}
button.ghost{background:#fff;color:#0f172a;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid var(--border);text-align:left;padding:10px}
th{font-weight:800;color:#334155}
.small{font-size:12px;color:var(--muted)}
.pill{font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--border);font-weight:700;font-size:12px}
.status-Scheduled{background:#eef4ff;border-color:#cfe0ff;color:#1e40af}
.status-Completed{background:#ecfdf5;border-color:#bbf7d0;color:#065f46}
.status-Cancelled{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.status-No-Show{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.status-Rescheduled{background:#f1f5f9;border-color:#cbd5e1;color:#334155}
.status-PendingPayment{background:#fffbeb;border-color:#fde68a;color:#92400e}
.status-Late-Cancelled{background:#fef2f2;border-color:#fca5a5;color:#b91c1c}
.right{margin-left:auto}

/* Checkbox styling */
input[type="checkbox"] {width: 18px; height: 18px; cursor: pointer;}

/* Bulk actions bar */
.bulk-bar {
  background: #f8fafc;
  border: 1px dashed #cbd5e1;
  border-radius: 8px;
  padding: 10px 16px;
  margin-top: 12px;
  display: none; /* hidden by default */
  align-items: center;
  gap: 12px;
}

/* Login gate */
#loginGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:9999}
#loginPanel{background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.2);width:340px;display:flex;flex-direction:column;gap:12px}

/* App visibility: hidden until auth */
.wrap{display:none}
body.authed .wrap{display:grid}
</style>
</head>
<body>
<header>
  <div><strong>Grand English — Admin</strong></div>
  <div class="row">
    <div id="loginInfo" class="small"></div>
    <button id="btnLogout" class="ghost" style="display:none">Logout</button>
  </div>
</header>

<div id="loginGate">
  <div id="loginPanel">
    <div style="font-weight:600;font-size:18px;text-align:center;">Admin Login</div>
    <input id="gateEmail" placeholder="email"/>
    <input id="gatePass" type="password" placeholder="password"/>
    <button id="gateLogin">Login</button>
    <div id="gateInfo" class="small" style="min-height:18px;text-align:center"></div>
  </div>
</div>

<div class="wrap" id="appRoot">
  <section class="card">
    <div class="row">
      <div class="pill">Stats</div>
      <button id="btnStats" class="ghost">Load Stats</button>
    </div>
    <div id="stats" class="row small" style="gap:20px;margin-top:10px"></div>
  </section>

  <section class="card">
    <div class="row">
      <div class="pill">Users</div>
      <input id="uQ" placeholder="search email/name"/>
      <input id="uSince" type="datetime-local" title="since"/>
      <input id="uTill" type="datetime-local" title="till"/>
      <select id="uLimit"><option>25</option><option>50</option><option>100</option></select>
      <button id="btnUsers">Load</button>
    </div>
    <table id="usersTbl">
      <thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Guest</th><th>Registered</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <div class="row">
      <div class="pill">Bookings</div>
      <select id="bStatus">
        <option value="">Any status</option>
        <option>PendingPayment</option> <option>Scheduled</option><option>Completed</option><option>Late-Cancelled</option><option>Cancelled</option>
        <option>No-Show</option><option>Rescheduled</option>
      </select>
      <input id="bEmail" placeholder="email filter"/>
      <input id="bFrom" type="datetime-local" title="from"/>
      <input id="bTo" type="datetime-local" title="to"/>
      <select id="bLimit"><option>25</option><option>50</option><option>100</option><option>200</option></select>
      <button id="btnBookings">Load</button>
    </div>

    <div class="bulk-bar" id="bulkBar">
      <strong>Bulk Actions:</strong>
      <span class="small" id="bulkCount">0 selected</span>
      <select id="bulkStatus">
        <option value="">-- Change status to --</option>
        <option>PendingPayment</option>
        <option>Scheduled</option>
        <option>Completed</option>
        <option>Late-Cancelled</option>
        <option>Cancelled</option>
        <option>No-Show</option>
        <option>Rescheduled</option>
      </select>
      <button id="btnBulkApply">Apply</button>
    </div>

    <table id="bookTbl">
      <thead>
        <tr>
          <th style="width: 40px;"><input type="checkbox" id="chkAll" title="Select All"></th>
          <th>When</th>
          <th>Student Email</th>
          <th>Child / Parent</th>
          <th>Level</th>
          <th>Teacher</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</div>

<script defer>
const $ = (id)=>document.getElementById(id);
const fmt = (d)=> new Date(d).toLocaleString();
function getBase(){ return window.location.origin; }
function getToken(){ return localStorage.getItem('GE_ADMIN_TOKEN') || ''; }
function setToken(t){ localStorage.setItem('GE_ADMIN_TOKEN', t||''); }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getToken();
  if (token) headers.Authorization = 'Bearer '+token;
  const r = await fetch(getBase()+path, { ...opts, headers });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.message||('HTTP '+r.status));
  return j;
}

function showApp(me){
  document.body.classList.add('authed');
  const gate = $('loginGate'); if (gate) gate.style.display = 'none';
  const lo = $('btnLogout'); if (lo) lo.style.display = '';
  const li = $('loginInfo'); if (li) li.textContent = 'Logged in as ' + (me.user?.email || '');
}

async function ensureAuthFromToken(){
  try{
    const me = await api('/api/me');
    if (me && me.success && me.user){
      showApp(me);
      return true;
    }
  }catch(e){ /* ignore */ }
  return false;
}

// Bulk update helpers
function updateBulkUI() {
  const checked = document.querySelectorAll('.bChk:checked').length;
  const total = document.querySelectorAll('.bChk').length;
  $('bulkCount').textContent = `${checked} selected`;
  $('bulkBar').style.display = checked > 0 ? 'flex' : 'none';
  $('chkAll').checked = (total > 0 && checked === total);
}

document.addEventListener('DOMContentLoaded', async ()=>{
  // Logout
  const lg = $('btnLogout');
  if (lg) lg.addEventListener('click', ()=>{ setToken(''); document.body.classList.remove('authed'); location.reload(); });

  // Try restore session
  if (!(await ensureAuthFromToken())){
    const info = $('gateInfo');
    const submit = async ()=>{
      const email = ($('gateEmail')?.value||'').trim();
      const password = ($('gatePass')?.value||'').trim();
      if(!email || !password){ if(info) info.textContent='Enter email and password'; return; }
      try{
        const res = await api('/api/login', { method:'POST', body: JSON.stringify({ email, password }) });
        if(res && res.success && res.token){
          setToken(res.token);
          const me = await api('/api/me');
          showApp(me);
        }else{
          if(info) info.textContent = (res && res.message) ? res.message : 'Login failed';
        }
      }catch(e){ if(info) info.textContent = e.message||'Login error'; }
    };
    $('gateLogin')?.addEventListener('click', submit);
    ['gateEmail','gatePass'].forEach(id=>$(id)?.addEventListener('keydown', ev=>{ if(ev.key==='Enter') submit(); }));
  }

  // Stats
  $('btnStats')?.addEventListener('click', async ()=>{
    try{
      const j = await api('/api/admin/stats');
      $('stats').innerHTML = `
        <div>Total users: <strong>${j.usersTotal}</strong></div>
        <div>Total bookings: <strong>${j.bookingsTotal}</strong></div>
        <div>Scheduled: <strong>${j.byStatus.Scheduled}</strong></div>
        <div>Completed: <strong>${j.byStatus.Completed}</strong></div>
        <div>Cancelled: <strong>${j.byStatus.Cancelled}</strong></div>
        <div>No-Show: <strong>${j.byStatus['No-Show']}</strong></div>`;
    }catch(e){ alert('Stats error: '+e.message); }
  });

  // Users
  $('btnUsers')?.addEventListener('click', async ()=>{
    try{
      const q = $('uQ').value.trim();
      const since = $('uSince').value ? new Date($('uSince').value).toISOString() : '';
      const till  = $('uTill').value  ? new Date($('uTill').value).toISOString()  : '';
      const limit = $('uLimit').value;
      const url = new URL(getBase()+'/api/admin/users');
      if(q) url.searchParams.set('q', q);
      if(since) url.searchParams.set('since', since);
      if(till) url.searchParams.set('till', till);
      url.searchParams.set('limit', limit);
      const j = await api(url.pathname + '?' + url.searchParams.toString());
      const tb = $('usersTbl').querySelector('tbody'); tb.innerHTML='';
      j.users.forEach(u=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.email}</td>
          <td>${(u.firstName||'')+' '+(u.lastName||'')}</td>
          <td>${u.role||'student'}</td>
          <td>${u.isGuest? 'Yes':'No'}</td>
          <td>${fmt(u.createdAt)}</td>`;
        tb.appendChild(tr);
      });
    }catch(e){ alert('Users error: '+e.message); }
  });

  // Bookings Main Load
  $('btnBookings')?.addEventListener('click', async ()=>{
    try{
      const status = $('bStatus').value, email = $('bEmail').value.trim();
      const df = $('bFrom').value ? new Date($('bFrom').value).toISOString() : '';
      const dt = $('bTo').value   ? new Date($('bTo').value).toISOString()   : '';
      const limit = $('bLimit').value;
      const url = new URL(getBase()+'/api/admin/bookings');
      if(status) url.searchParams.set('status', status);
      if(email)  url.searchParams.set('email', email);
      if(df) url.searchParams.set('dateFrom', df);
      if(dt) url.searchParams.set('dateTo', dt);
      url.searchParams.set('limit', limit);

      const j = await api(url.pathname + '?' + url.searchParams.toString());
      const tb = $('bookTbl').querySelector('tbody'); tb.innerHTML='';
      
      // Reset bulk actions state
      $('chkAll').checked = false;
      updateBulkUI();

      j.bookings.forEach(b=>{
        const tr = document.createElement('tr');
        const tag = (txt)=>`<span class="tag status-${txt.replace(' ','-')}">${txt}</span>`;
        tr.innerHTML = `
          <td><input type="checkbox" class="bChk" value="${b._id}"></td>
          <td>
            <div>${b.dateStr||'—'} ${b.timeStr||''}</div>
            <div class="small">created: ${fmt(b.createdAt)}</div>
          </td>
          <td>${b.email}</td>
          <td>${b.childName||'—'}<div class="small">${b.parentName||''}</div></td>
          <td>${b.level||'—'}</td>
          <td>${b.teacherName||'—'}</td>
          <td>${tag(b.status)}</td>
          <td>
            <div class="row">
              <select data-id="${b._id}" class="stSel">
  <option ${b.status==='PendingPayment'?'selected':''}>PendingPayment</option>
  <option ${b.status==='Scheduled'?'selected':''}>Scheduled</option>
  <option ${b.status==='Completed'?'selected':''}>Completed</option>
  <option ${b.status==='Late-Cancelled'?'selected':''}>Late-Cancelled</option>
  <option ${b.status==='Cancelled'?'selected':''}>Cancelled</option>
  <option ${b.status==='No-Show'?'selected':''}>No-Show</option>
  <option ${b.status==='Rescheduled'?'selected':''}>Rescheduled</option>
</select>
              <button class="ghost btnSave" data-id="${b._id}">Save</button>
            </div>
            <div class="small" style="margin-top:6px">
              <label>New date:</label> <input class="dt" data-id="${b._id}" style="width:160px" type="date">
              <label>time:</label> <input class="tm" data-id="${b._id}" style="width:120px" type="time" step="900">
            </div>
          </td>`;
        tb.appendChild(tr);
      });

      // Single Save Listeners
      tb.querySelectorAll('.btnSave').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.dataset.id;
          const st = tb.querySelector(`.stSel[data-id="${id}"]`).value;
          const nd = tb.querySelector(`.dt[data-id="${id}"]`).value;
          const nt = tb.querySelector(`.tm[data-id="${id}"]`).value;
          const body = { status: st };
          if(nd) body.dateStr = nd;
          if(nt) body.timeStr = nt;
          try{
            await api(`/api/admin/bookings/${id}/status`, { method:'PATCH', body: JSON.stringify(body) });
            btn.textContent='Saved'; setTimeout(()=>btn.textContent='Save', 1200);
            // Optional: Auto-reload to see color changes
            // $('btnBookings').click(); 
          }catch(e){ alert('Save error: '+e.message); }
        };
      });

    }catch(e){ alert('Bookings error: '+e.message); }
  });

  // --- Bulk Selection Listeners ---
  $('chkAll')?.addEventListener('change', (e) => {
    document.querySelectorAll('.bChk').forEach(chk => chk.checked = e.target.checked);
    updateBulkUI();
  });

  $('bookTbl')?.addEventListener('change', (e) => {
    if(e.target.classList.contains('bChk')) {
      updateBulkUI();
    }
  });

  // Bulk Apply Logic
  $('btnBulkApply')?.addEventListener('click', async () => {
    const newStatus = $('bulkStatus').value;
    if (!newStatus) return alert('Please select a status first.');

    const checkboxes = document.querySelectorAll('.bChk:checked');
    const ids = Array.from(checkboxes).map(c => c.value);
    
    if(!confirm(`Are you sure you want to change the status of ${ids.length} lessons to "${newStatus}"?`)) return;

    const btn = $('btnBulkApply');
    btn.textContent = 'Updating...';
    btn.disabled = true;

    try {
      // Parallel requests (no backend change required)
      await Promise.all(ids.map(id => 
        api(`/api/admin/bookings/${id}/status`, { 
          method: 'PATCH', 
          body: JSON.stringify({ status: newStatus }) 
        })
      ));
      
      // Reload table to show updated statuses
      $('btnBookings').click(); 
    } catch(e) {
      alert('Error during bulk update: ' + e.message);
    } finally {
      btn.textContent = 'Apply';
      btn.disabled = false;
      $('bulkStatus').value = '';
    }
  });

});
</script>
</body>
</html>
